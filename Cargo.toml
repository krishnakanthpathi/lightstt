[package]
name = "lightstt"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast, cross-platform Speech-to-Text backend and CLI (lstt) with embedded S1-mini normalization"
authors = ["Krishna Kanth"]
license = "MIT"

[lib]
name = "lightstt"
path = "src/lib.rs"

[[bin]]
name = "lstt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
hound = "3.5"
cpal = "0.15"
colored = "2.1"
dirs = "5.0"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
